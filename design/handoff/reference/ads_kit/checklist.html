<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Smile Lab · Checklist pre-publicación</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="../../assets/ds-fallback.js"></script>
<style>html,body{margin:0}body{background:var(--bg);font-family:var(--font-text);color:var(--ink)}*{box-sizing:border-box}a{color:var(--accent-ink)}a:hover{color:var(--ink)}</style></head><body><div id="root"></div>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel">
const ITEMS = [
  ["Contraste", ["Todo texto ≥ 4.5:1 (ver pares en Colors · Contrast pairs).", "Nada de blanco sobre #8cc3c8. Sobre accent va #1b2c31.", "Texto sobre foto con velo #22343a 35–55% o tarjeta sólida."]],
  ["Formato", ["Zonas seguras 9:16 libres: 250px arriba; 250px abajo en Stories, 420px en Reels.", "Recortes 1:1, 4:5 y 9:16 derivados de la misma foto y punto focal.", "Texto primario ≤ 125 caracteres; título Meta 27–40; Google 30 / 90 / 90."]],
  ["Marca", ["Logo ≥ 48px de alto (lienzo 1080), con área de respeto de ½ símbolo.", "Logo sobre barra o tarjeta #ffffff / #f6fafa, nunca suelto sobre foto.", "Titulares en Jost Light, una sola palabra en itálica.", "Un solo bloque oscuro por pieza. brand / brand-light solo en el logo."]],
  ["Contenido sanitario", ["Sin promesa de resultado («sonrisa perfecta», «sin dolor garantizado»).", "Fotos propias de la clínica, sin stock de pacientes.", "Si hay precio o promo: vigencia y condiciones en la franja de legales.", "Legales con director odontológico y matrícula, texto confirmado con el Colegio.", "Voseo rioplatense, sin signos de exclamación, sin urgencia falsa."]],
];
function App() {
  const [done, setDone] = React.useState(() => JSON.parse(localStorage.getItem("sl-check") || "{}"));
  React.useEffect(() => localStorage.setItem("sl-check", JSON.stringify(done)), [done]);
  const total = ITEMS.reduce((a, [, l]) => a + l.length, 0);
  const n = Object.values(done).filter(Boolean).length;
  return (<div><KitNav current="checklist.html" />
    <div style={{ padding: 32, maxWidth: 980, display: "flex", flexDirection: "column", gap: 24 }}>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
        <DS.Headline level={2} size={40} text="Antes de *publicar*" />
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}><span style={{ fontSize: 14, color: "var(--body)" }}>{n} de {total}</span><DS.Button size="web" variant="secondary" onClick={() => setDone({})}>Reiniciar</DS.Button></div>
      </div>
      {ITEMS.map(([g, list]) => (
        <div key={g} style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 22, padding: "20px 24px", display: "flex", flexDirection: "column", gap: 4 }}>
          <DS.Kicker size={12} style={{ marginBottom: 10 }}>{g}</DS.Kicker>
          {list.map(t => { const id = g + t; return (
            <label key={id} style={{ display: "flex", gap: 14, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--line)", cursor: "pointer", fontSize: 15, lineHeight: 1.5, color: done[id] ? "var(--muted2)" : "var(--ink)" }}>
              <input type="checkbox" checked={!!done[id]} onChange={e => setDone({ ...done, [id]: e.target.checked })} style={{ width: 20, height: 20, marginTop: 1, accentColor: "#3c757c" }} />{t}
            </label>); })}
        </div>))}
    </div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
